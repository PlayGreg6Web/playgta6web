name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR branch; never cancel runs on main.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: No Game Files Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject forbidden game extensions or .env in git
        run: |
          BAD=$(git ls-files | grep -iE '(^|/)\.env$|\.(rpf|xvd|xvc|ttpf|awc|dxbc|spv|wgsl\.pack|pgim|exe|dll)$' || true)
          if [ -n "$BAD" ]; then
            echo "Forbidden files tracked in git:"
            echo "$BAD"
            exit 1
          fi

  stale-revert:
    name: No Stale Revert Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_stale_revert.py --base origin/${{ github.base_ref }} --head HEAD

  rust:
    name: Rust Pipelines (recomp, shaders, tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report LLVM tools (which llc/opt the recompiler will use)
        run: |
          which -a llc opt clang || true
          clang --version || true
          readlink -f /usr/bin/clang || true
          ls /usr/lib | grep -i llvm || true
      - run: cargo test --workspace

  runtime-cpp:
    name: C++ Runtime ABI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: runtime-cpp
          save: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          cmake -S runtime -B runtime/build-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build runtime/build-host --parallel
          ctest --test-dir runtime/build-host --output-on-failure --parallel 4

  native-executor-windows:
    name: Native Executor Build (Dawn, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned Dawn + DXC prebuilts
        uses: actions/cache@v4
        with:
          path: .fc-cache
          key: fc-dawn-7435fd87c506-dxc-1.9.2609-${{ github.event.repository.name }}
      - name: Configure (PLAYGTA6_NATIVE_EXECUTOR=ON)
        run: cmake -S runtime -B build-native-exec -DCMAKE_BUILD_TYPE=Release -DPLAYGTA6_NATIVE_EXECUTOR=ON "-DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.fc-cache"
      - name: Build everything (boot harness, executor, and all runtime unit tests)
        run: cmake --build build-native-exec --config Release --parallel
      # The Linux job skips every Windows-only branch (lazy commit, write tracking, the D3D12 export
      # surface, minidumps); the full suite runs here against the same build. GPU tests skip without an adapter.
      - name: Run all runtime unit tests (Windows paths) and executor tests
        run: ctest --test-dir build-native-exec -C Release --output-on-failure --parallel 4 --timeout 300
      - name: E2E smoke on the WARP software adapter (replay, digests, PNG dump, native_replay_compare --self-check)
        run: python tests/native_exec_warp_smoke.py --exec build-native-exec/Release/pg6_native_exec.exe --gen build-native-exec/Release/gen_native_exec_trace.exe

  python-and-web:
    name: Server, Local Env & Web JS Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: |
          for f in $(find web -name '*.js'); do node --check "$f"; done
          node --test tests/*.mjs
